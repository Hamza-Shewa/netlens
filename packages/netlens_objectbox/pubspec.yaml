name: netlens_objectbox
description: "ObjectBox storage for NetLens. Keeps calls caught by the NetLens in-app HTTP inspector in an ObjectBox database across app restarts."
version: 1.2.0
repository: https://github.com/Hamza-Shewa/netlens/tree/master/packages/netlens_objectbox
issue_tracker: https://github.com/Hamza-Shewa/netlens/issues
topics:
  - http
  - inspector
  - netlens
  - interceptor
  - objectbox

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  netlens: ^1.2.0
  json_annotation: ^4.12.0
  meta: ^1.19.0
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  path: ^1.9.1
  path_provider: ^2.1.6
  flat_buffers: ^25.9.23

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2
  objectbox_generator: ^5.3.2
