name: netlens_http_client
description: "NetLens adapter for dart:io HttpClient. Catches HttpClient calls for the NetLens in-app HTTP inspector and lets NetLens resend them."
version: 1.0.0
repository: https://github.com/Hamza-Shewa/netlens/tree/master/packages/netlens_http_client
issue_tracker: https://github.com/Hamza-Shewa/netlens/issues
topics:
  - http
  - inspector
  - netlens
  - interceptor

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  netlens: ^1.1.0
dev_dependencies:
  flutter_lints: ^6.0.0
  netlens_test: ^1.1.0
  mocktail: ^1.0.5
  test: ^1.31.1