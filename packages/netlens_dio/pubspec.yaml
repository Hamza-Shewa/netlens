name: netlens_dio
description: "NetLens adapter for Dio. Catches Dio calls for the NetLens in-app HTTP inspector and lets NetLens resend them."
version: 1.2.0
repository: https://github.com/Hamza-Shewa/netlens/tree/master/packages/netlens_dio
issue_tracker: https://github.com/Hamza-Shewa/netlens/issues
topics:
  - http
  - inspector
  - dio
  - interceptor
  - netlens

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  netlens: ^1.2.0
  dio: ^5.11.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.31.1
  mocktail: ^1.0.5
  http_mock_adapter: ^0.6.1
  netlens_test: ^1.1.0
