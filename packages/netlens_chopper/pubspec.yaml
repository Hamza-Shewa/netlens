name: netlens_chopper
description: "NetLens adapter for Chopper. Catches Chopper calls for the NetLens in-app HTTP inspector in Flutter apps."
version: 1.2.0
repository: https://github.com/Hamza-Shewa/netlens/tree/master/packages/netlens_chopper
issue_tracker: https://github.com/Hamza-Shewa/netlens/issues
topics:
  - http
  - inspector
  - netlens
  - chopper
  - interceptor

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  netlens: ^1.2.0
  chopper: ^8.7.1
  http: ^1.6.0
  uuid: ^4.6.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.31.1
  netlens_test: ^1.1.0
  mocktail: ^1.0.5
  build_runner: ^2.15.1
  chopper_generator: ^8.7.1
  json_serializable: ^6.15.2
  json_annotation: ^4.12.0
  equatable: ^3.0.0
